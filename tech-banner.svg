<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Lucas Curto — fullstack developer</title>
  <desc id="desc">Technology banner with circuit elements, neon glow and the LC signature.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050816"/><stop offset="0.55" stop-color="#101b3d"/><stop offset="1" stop-color="#07111f"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="0.5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#94a3b8" stroke-opacity=".08" stroke-width="1"/></pattern>
  </defs>
  <rect width="1200" height="330" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="330" rx="24" fill="url(#grid)"/>
  <path d="M0 260 C240 170 370 310 585 205 S920 90 1200 180" fill="none" stroke="url(#line)" stroke-width="2" opacity=".7" filter="url(#glow)"/>
  <path d="M770 0 V80 H920 V130 H1050 V55 H1200" fill="none" stroke="#22d3ee" stroke-width="2" opacity=".7"/>
  <path d="M845 330 V250 H970 V205 H1120 V255 H1200" fill="none" stroke="#8b5cf6" stroke-width="2" opacity=".6"/>
  <circle cx="770" cy="260" r="5" fill="#22d3ee" filter="url(#glow)"/><circle cx="920" cy="205" r="5" fill="#8b5cf6" filter="url(#glow)"/><circle cx="1050" cy="55" r="5" fill="#ec4899" filter="url(#glow)"/>
  <text x="82" y="88" fill="#22d3ee" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="6">LC // PROFILE 01</text>
  <text x="78" y="176" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="700">Lucas Curto</text>
  <text x="82" y="224" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="23" letter-spacing="3">FULLSTACK  /  WEB  /  APIs  /  DATA</text>
  <rect x="82" y="267" width="340" height="3" rx="2" fill="url(#line)"/>
  <text x="82" y="302" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="16">building systems layer by layer</text>
  <text x="1085" y="292" fill="#22d3ee" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="2">ONLINE</text>
</svg>
